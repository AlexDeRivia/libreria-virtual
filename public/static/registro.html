<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Nuevo Cliente</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>

    <div class="container">
        <h2>Registro de Nuevo Cliente</h2>
        <form>
            <div class="form-group">
                <label for="username">Nombre de Usuario:</label>
                <input type="text" class="form-control" id="username" placeholder="Ingrese su nombre de usuario"
                    required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar Contraseña:</label>
                <input type="password" class="form-control" id="confirm_password" placeholder="Confirme su contraseña"
                    required>
            </div>
            <div class="form-group">
                <label for="last_name">Apellidos:</label>
                <input type="text" class="form-control" id="last_name" placeholder="Ingrese sus apellidos" required>
            </div>
            <div class="form-group">
                <label for="first_name">Nombres:</label>
                <input type="text" class="form-control" id="first_name" placeholder="Ingrese sus nombres" required>
            </div>
            <div class="form-group">
                <label for="address">Dirección:</label>
                <input type="text" class="form-control" id="address" placeholder="Ingrese su dirección" required>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="country">País:</label>
                    <select id="country" class="form-control" required>
                        <option value="">Seleccionar...</option>
                        <!-- Aquí puedes agregar opciones de países permitidos -->
                    </select>
                </div>
                <div class="form-group col-md-6">
                    <label for="province">Provincia:</label>
                    <select id="province" class="form-control" required>
                        <option value="">Seleccionar...</option>
                        <!-- Aquí puedes agregar opciones de provincias permitidas -->
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="locality">Localidad:</label>
                <input type="text" class="form-control" id="locality" placeholder="Ingrese su localidad" required>
            </div>
            <div class="form-group">
                <label for="postal_code">Código Postal:</label>
                <input type="text" class="form-control" id="postal_code" placeholder="Ingrese su código postal"
                    required>
            </div>
            <div class="form-group">
                <label for="phone">Teléfono:</label>
                <input type="tel" class="form-control" id="phone" placeholder="Ingrese su número de teléfono" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" class="form-control" id="email" placeholder="Ingrese su correo electrónico"
                    required>
            </div>
            <div class="form-group">
                <label for="shipping_preference">Preferencia de Envío:</label>
                <select id="shipping_preference" class="form-control" required>
                    <option value="">Seleccionar...</option>
                    <option value="standard">Estándar</option>
                    <option value="express">Express</option>
                </select>
            </div>
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="one_click">
                <label class="form-check-label" for="one_click">Activar Modo 1-Click</label>
            </div>
            <div class="form-group">
                <label for="type">Tipo:</label>
                <select id="type" class="form-control" required>
                    <option value="">Seleccionar...</option>
                    <option value="individual">Individual</option>
                    <option value="business">Negocio</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Registrarse</button>
        </form>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>

</html>
